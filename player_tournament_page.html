<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Registration - Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            color: white;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(145, 36, 255, 0.5);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: bold;
        }

        .btn-back {
            padding: 12px 24px;
            background: linear-gradient(135deg, #9124FF, #FF6682);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(145, 36, 255, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #FFD93D, #FFB800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 50px;
            font-size: 18px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid rgba(145, 36, 255, 0.5);
            text-align: center;
        }

        .stat-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffd93d;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #aaa;
        }

        .filter-section {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid rgba(145, 36, 255, 0.5);
            margin-bottom: 30px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            color: #ddd;
            font-weight: 600;
        }

        .filter-group select {
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #FFD93D;
        }

        .tournaments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 25px;
        }

        .tournament-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgba(255, 217, 61, 0.3);
            transition: all 0.3s;
        }

        .tournament-card:hover {
            border-color: #ffd93d;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 217, 61, 0.3);
        }

        .tournament-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .tournament-name {
            font-size: 24px;
            font-weight: bold;
            color: #ffd93d;
            flex: 1;
        }

        .tournament-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 10px;
        }

        .tournament-status.live {
            background: #e74c3c;
            color: white;
            animation: pulse 1.5s infinite;
        }

        .tournament-status.upcoming {
            background: #3498db;
            color: white;
        }

        .tournament-status.completed {
            background: #95a5a6;
            color: white;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .tournament-description {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.6;
            min-height: 40px;
        }

        .tournament-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-item {
            font-size: 14px;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-icon {
            font-size: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            transition: width 0.3s;
        }

        .progress-fill.full {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }

        .participants-count {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .registration-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.5);
        }

        .btn-register.unregister {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .btn-register.unregister:hover {
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.5);
        }

        .btn-register:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-register.live {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
        }

        .empty-icon {
            font-size: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 1200px) {
            .tournaments-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 217, 61, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 217, 61, 0.8);
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-title">
            🎮 Tournament Registration
        </div>
        <a href="dashboard_multiplayer_html.html" class="btn-back">← Back to Dashboard</a>
    </div>

    <div class="container">
        <h1 class="page-title">🏆 Available Tournaments</h1>
        <p class="page-subtitle">Register and compete in exciting gaming tournaments</p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value" id="availableTournaments">0</div>
                <div class="stat-label">Available Tournaments</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="myRegistrations">0</div>
                <div class="stat-label">My Registrations</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔴</div>
                <div class="stat-value" id="liveTournaments">0</div>
                <div class="stat-label">Live Now</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Filter by Status</label>
                    <select id="filterStatus" onchange="applyFilters()">
                        <option value="all">All Tournaments</option>
                        <option value="upcoming">Upcoming Only</option>
                        <option value="live">Live Now</option>
                        <option value="registered">My Registrations</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Filter by Game</label>
                    <select id="filterGame" onchange="applyFilters()">
                        <option value="all">All Games</option>
                        <option value="Target Game">🎯 Target Game</option>
                        <option value="Box Game">🟦 Box Game</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Sort by</label>
                    <select id="sortBy" onchange="applyFilters()">
                        <option value="date-asc">Date (Earliest First)</option>
                        <option value="date-desc">Date (Latest First)</option>
                        <option value="participants">Most Participants</option>
                        <option value="spots">Most Spots Available</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="tournaments-grid" id="tournamentsGrid"></div>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser');

        if (!currentUser) {
            alert('Please login first!');
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTournaments();
            updateStats();
        });

        function loadTournaments() {
            const tournaments = JSON.parse(localStorage.getItem('tournaments') || '[]');
            applyFilters();
        }

        function applyFilters() {
            const tournaments = JSON.parse(localStorage.getItem('tournaments') || '[]');
            const statusFilter = document.getElementById('filterStatus').value;
            const gameFilter = document.getElementById('filterGame').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = tournaments.filter(tournament => {
                const now = Date.now();
                const startTime = new Date(tournament.startDate).getTime();
                
                let status = tournament.status || 'upcoming';
                if (now >= startTime && status !== 'completed') {
                    status = 'live';
                }

                if (statusFilter === 'upcoming' && status !== 'upcoming') return false;
                if (statusFilter === 'live' && status !== 'live') return false;
                if (statusFilter === 'registered' && !tournament.participants?.includes(currentUser)) return false;
                if (gameFilter !== 'all' && tournament.gameType !== gameFilter) return false;

                return true;
            });

            // Sort
            filtered.sort((a, b) => {
                if (sortBy === 'date-asc') {
                    return new Date(a.startDate) - new Date(b.startDate);
                } else if (sortBy === 'date-desc') {
                    return new Date(b.startDate) - new Date(a.startDate);
                } else if (sortBy === 'participants') {
                    return (b.participants?.length || 0) - (a.participants?.length || 0);
                } else if (sortBy === 'spots') {
                    const spotsA = a.maxParticipants - (a.participants?.length || 0);
                    const spotsB = b.maxParticipants - (b.participants?.length || 0);
                    return spotsB - spotsA;
                }
                return 0;
            });

            displayTournaments(filtered);
        }

        function displayTournaments(tournaments) {
            const grid = document.getElementById('tournamentsGrid');

            if (!tournaments.length) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-icon">🏆</div>
                        <div style="font-size: 24px; margin-bottom: 10px;">No Tournaments Found</div>
                        <div style="font-size: 16px;">Try adjusting your filters or check back later!</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';

            tournaments.forEach(tournament => {
                const now = Date.now();
                const startTime = new Date(tournament.startDate).getTime();

                let status = tournament.status || 'upcoming';
                let statusText = 'Upcoming';

                if (status === 'live' || (now >= startTime && status !== 'completed')) {
                    status = 'live';
                    statusText = '🔴 LIVE';
                } else if (status === 'completed') {
                    statusText = 'Completed';
                }

                const isRegistered = tournament.participants?.includes(currentUser);
                const participantCount = tournament.participants?.length || 0;
                const isFull = participantCount >= tournament.maxParticipants;
                const canRegister = !isRegistered && !isFull && status === 'upcoming';
                const progressPercent = (participantCount / tournament.maxParticipants) * 100;

                const card = document.createElement('div');
                card.className = 'tournament-card';

                card.innerHTML = `
                    <div class="tournament-header">
                        <div class="tournament-name">🏆 ${tournament.name}</div>
                        <span class="tournament-status ${status}">${statusText}</span>
                    </div>

                    <div class="tournament-description">${tournament.description}</div>

                    ${isRegistered ? `
                        <div class="registration-badge">
                            ✅ You are registered
                        </div>
                    ` : ''}

                    <div class="tournament-info">
                        <div class="info-item">
                            <span class="info-icon">📅</span>
                            <span>${new Date(tournament.startDate).toLocaleDateString()}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">⏰</span>
                            <span>${new Date(tournament.startDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">🎮</span>
                            <span>${tournament.gameType}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">👤</span>
                            <span>Max: ${tournament.maxParticipants}</span>
                        </div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill ${isFull ? 'full' : ''}" style="width: ${progressPercent}%"></div>
                    </div>
                    <div class="participants-count">
                        ${participantCount} / ${tournament.maxParticipants} players registered
                        ${isFull ? ' • Tournament Full' : ` • ${tournament.maxParticipants - participantCount} spots left`}
                    </div>

                    ${canRegister ? `
                        <button class="btn-register" onclick="registerForTournament('${tournament.id}')">
                            📝 Register for Tournament
                        </button>
                    ` : isRegistered && status === 'upcoming' ? `
                        <button class="btn-register unregister" onclick="unregisterFromTournament('${tournament.id}')">
                            ❌ Unregister
                        </button>
                    ` : isFull && !isRegistered ? `
                        <button class="btn-register" disabled>
                            🚫 Tournament Full
                        </button>
                    ` : status === 'live' ? `
                        <button class="btn-register live" onclick="alert('Tournament is currently live! ${isRegistered ? 'Get ready to compete!' : 'Registration is closed.'}')">
                            🔴 ${isRegistered ? 'Tournament Live' : 'Live Now'}
                        </button>
                    ` : status === 'completed' ? `
                        <button class="btn-register" disabled>
                            ✓ Tournament Completed
                        </button>
                    ` : ''}
                `;

                grid.appendChild(card);
            });
        }

        function registerForTournament(tournamentId) {
            let tournaments = JSON.parse(localStorage.getItem('tournaments') || '[]');
            const tournament = tournaments.find(t => t.id === tournamentId);

            if (!tournament) return;

            if (tournament.participants?.includes(currentUser)) {
                alert('You are already registered for this tournament!');
                return;
            }

            if ((tournament.participants?.length || 0) >= tournament.maxParticipants) {
                alert('This tournament is full!');
                return;
            }

            if (!tournament.participants) {
                tournament.participants = [];
            }

            tournament.participants.push(currentUser);
            localStorage.setItem('tournaments', JSON.stringify(tournaments));

            applyFilters();
            updateStats();
            alert('✅ Successfully registered for ' + tournament.name + '!\n\nGood luck in the tournament!');
        }

        function unregisterFromTournament(tournamentId) {
            if (!confirm('Are you sure you want to unregister from this tournament?')) return;

            let tournaments = JSON.parse(localStorage.getItem('tournaments') || '[]');
            const tournament = tournaments.find(t => t.id === tournamentId);

            if (!tournament) return;

            tournament.participants = tournament.participants.filter(p => p !== currentUser);
            localStorage.setItem('tournaments', JSON.stringify(tournaments));

            applyFilters();
            updateStats();
            alert('You have been unregistered from the tournament.');
        }

        function updateStats() {
            const tournaments = JSON.parse(localStorage.getItem('tournaments') || '[]');

            const available = tournaments.filter(t => {
                const now = Date.now();
                const startTime = new Date(t.startDate).getTime();
                return (t.status === 'upcoming' || now < startTime) && (t.participants?.length || 0) < t.maxParticipants;
            }).length;

            const myRegistrations = tournaments.filter(t => t.participants?.includes(currentUser)).length;

            const live = tournaments.filter(t => {
                const now = Date.now();
                const startTime = new Date(t.startDate).getTime();
                return t.status === 'live' || (now >= startTime && t.status !== 'completed');
            }).length;

            document.getElementById('availableTournaments').textContent = available;
            document.getElementById('myRegistrations').textContent = myRegistrations;
            document.getElementById('liveTournaments').textContent = live;
        }
    </script>
</body>

</html>
